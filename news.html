  <style>
    :root {
      --bg: #032340;
      --fg: #f5fbff;
      --muted: #a8c6df;
      --card: #07345f;
      --accent: #29aeea;
      --border: rgba(185, 226, 255, 0.2);
      --maxw: 920px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4fbff;
        --fg: #06294a;
        --muted: #4d6880;
        --card: #ffffff;
        --accent: #087fb8;
        --border: rgba(6, 41, 74, 0.14);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .container { max-width: var(--maxw); margin: 0 auto; padding: 24px; }
    header { border-bottom: 1px solid var(--border); }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); font-weight: 800; }
    .brand-logo { width: 28px; height: 28px; border-radius: 6px; }
    .links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
    .links a { color: var(--fg); opacity: .9; }
    main { padding-bottom: 48px; }
    .hero { padding: 48px 0 20px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 58px); line-height: 1; }
    section { border-top: 1px solid var(--border); padding: 28px 0; }
    .news-item {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
    }
    time { display: block; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: var(--muted); }
    footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
  </style>
  <script defer data-domain="toppymicros.com" data-auto="false" src="https://plausible.io/js/script.tag"></script>
  <script defer src="/assets/global.js"></script>
</head>
<body>
  <header>
    <nav class="container nav" aria-label="Main">
      <a href="/" class="brand" aria-label="Home">

        <span>ToppyMicroServices OÜ</span>
      </a>
      <div class="links">
        <a href="/">Home</a>
        <a href="/#research">Research</a>
        <a href="/contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="hero" aria-label="News">
      <p class="eyebrow">News</p>
      <h1>News</h1>
    </section>

    <section aria-label="News items">
      <article class="news-item">
        <time datetime="2026-07">Jul,2026</time>
        <h2>ICML 2026 workshop participation</h2>
        <p>Our research engineer will participate in the EIML workshop at ICML 2026 in Seoul with a poster.</p>
      </article>
    </section>
  </main>

  <footer>
    <div class="container">© 2026 ToppyMicroServices OÜ</div>
  </footer>
</body>

    .button { display:inline-flex; min-height:44px; align-items:center; justify-content:center; padding:10px 18px; background:var(--accent); color:var(--bg); border:1px solid var(--accent); border-radius:6px; font-size:14px; font-weight:700; }
    .button:hover { background:#9fe4ff; text-decoration:none; }
